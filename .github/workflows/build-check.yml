name: build-check

on:
  push:
    branches: [b0.2.9-implementation]
  pull_request:
    branches: [main, b0.2.6-implementation]
  workflow_dispatch:

jobs:
  multiplatform:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14' 
        cache: 'pip'
    - uses: actions/cache@v6
      with:
        key: env-files-win-laz
        path: |
          ${{ github.workspace }}/tool/data
    - run: pip install -r requirements.txt
    - run: python tool/validate_b029.py
    - run: |
        .\build.bat setup
        .\build.bat pack -p multiplatform -v 9 --no-zip
    - uses: actions/upload-artifact@v4
      with:
        name: newb-x-bare-visuals-b0.2.9-multiplatform-pr
        path: ./build/pack-multiplatform

  android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        cache: 'pip'
    - uses: actions/cache@v6
      with:
        key: env-files-linux-laz
        path: |
          ${{ github.workspace }}/tool/data
    - run: pip install -r requirements.txt
    - run: python tool/validate_b029.py
    - run: |
        ./build.sh setup
        ./build.sh pack -p android -v 9 --no-zip
    - uses: actions/upload-artifact@v4
      with:
        name: newb-x-bare-visuals-b0.2.9-android-pr
        path: ./build/pack-android
