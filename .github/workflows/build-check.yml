name: build-check

on:
  push:
    branches: [main, 'b0.3.7-implementation*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Implementation checks build Android only. Multiplatform is reserved for release preparation.
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        cache: 'pip'
    - uses: actions/cache@v6
      with:
        key: env-files-linux-laz
        path: |
          ${{ github.workspace }}/tool/data
    - run: pip install -r requirements.txt
    - run: python tool/audit_duplicates.py
    - run: python tool/validate_pack.py
    - id: version
      run: python tool/versioning.py
    - run: |
        ./build.sh setup
        ./build.sh pack -p android -v 7 --no-zip
    - uses: actions/upload-artifact@v4
      with:
        name: newb-x-bare-visuals-${{ steps.version.outputs.full_version_slug }}-android-implementation
        path: ./build/pack-android
